name: Browser
description: Chromium of Playwright from the cache; downloaded only when Playwright changes (docs/45).
runs:
  using: composite
  steps:
    - id: version
      run: echo "playwright=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ steps.version.outputs.playwright }}
    # The libraries Chromium needs are on the GitHub runner already: no apt step.
    - run: pnpm exec playwright install chromium
      shell: bash
