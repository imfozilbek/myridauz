# Production on its own account (owner decision 13.10.2026, docs/179, docs/32): after CI on main went
# green with the internal deploy, and only after the owner approves it (Environment "production"). A
# workflow of its own: a deploy waiting for the approval never holds the queue of CI on main.
name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Again by hand, for example after "Map data" (docs/67): whatever changed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The newest main only, once its push passed CI, and only when something deployed changed since the
  # last deploy of production (scripts/deploy-needed.mjs).
  changes:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
      actions: read
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          ALWAYS: ${{ github.event_name == 'workflow_dispatch' && '--always' || '' }}
        run: |
          deploy="$(node scripts/deploy-needed.mjs --env=production --workflow=deploy-production.yml --after=ci.yml ${ALWAYS})"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm run deploy --brand=rida --env=production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
