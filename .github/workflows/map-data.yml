# The map of the Mini App (G22, docs/67): cuts Uzbekistan out of OpenStreetMap and puts it into R2.
# Started by hand after MAP_ARCHIVE changes and once on a new account: only from main, only through
# the Environment of the chosen environment (docs/32, docs/179). Pull requests never reach it.
name: Map data

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where the map goes
        type: choice
        # Production joins with its account (owner decision 13.10.2026, docs/179).
        options: [internal]
        required: true

permissions:
  contents: read

concurrency:
  group: map-data-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm map-data --brand=rida --env="${MAP_ENVIRONMENT}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAP_ENVIRONMENT: ${{ inputs.environment }}
