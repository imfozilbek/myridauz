# The map of the Mini App (G22, docs/67): cuts Uzbekistan out of OpenStreetMap and puts it into R2.
# Started by hand after MAP_ARCHIVE changes: only from main, only through the Environment
# "production" that the owner approves (docs/32). Pull requests never reach it.
name: Map data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm map-data --brand=rida
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
