# The mutation score of the business logic (G89, docs/45): once a week Stryker changes the code of
# domain and application a little (a sign, a condition, a number) and runs every backend test. A
# change no test notices is a place a test runs but checks nothing. No secrets: nothing here
# deploys or reads a key (docs/32). The run fails below the score of stryker.config.mjs.
name: Mutation

on:
  schedule:
    # Sunday 22:17 UTC: Monday 03:17 in Tashkent, outside the hours of the team.
    - cron: '17 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stryker:
    runs-on: ubuntu-latest
    # About 9 000 changes: near two hours on four cores.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm mutation --concurrency 4
      # The changes that lived, file by file: what the next tests should check.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/mutation.json
          retention-days: 30
